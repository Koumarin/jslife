<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&icon_names=play_arrow,pause,skip_next" rel="stylesheet" />
    <link rel="stylesheet" href="style.css"/>
    <script type="module" src="src/main.js" defer></script>

    <title>JS Life</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div>
      <input type="radio" id="button_play" name="play_pause"/>
      <label for="button_play" class="material-symbols-outlined">
	play_arrow
      </label>

      <input type="radio" id="button_pause" name="play_pause" checked/>
      <label for="button_pause" class="material-symbols-outlined">
	pause
      </label>

      <button id="button_step">
	<span class="material-symbols-outlined">skip_next</span>
      </button>

      <button id="button_randomize">Randomize</button>
      <button id="button_clear">Clear</button>
    </div>

    <canvas id="canvas">Your browser does not support canvas.</canvas>
  </body>
</html>
